name: Deploy Private World web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_AUTH_API_URL: ${{ vars.EXPO_PUBLIC_AUTH_API_URL || secrets.EXPO_PUBLIC_AUTH_API_URL || 'https://shared-chronicle--faizaniqubal206.replit.app' }}
      EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY || secrets.EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate public Firebase configuration
        shell: bash
        run: |
          required_vars=(
            EXPO_PUBLIC_FIREBASE_API_KEY
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
            EXPO_PUBLIC_FIREBASE_PROJECT_ID
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            EXPO_PUBLIC_FIREBASE_APP_ID
            EXPO_PUBLIC_AUTH_API_URL
            EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY
          )
          for variable_name in "${required_vars[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required variable: ${variable_name}"
              exit 1
            fi
          done
           if [[ "$EXPO_PUBLIC_AUTH_API_URL" != "https://shared-chronicle--faizaniqubal206.replit.app" ]]; then
             echo 'EXPO_PUBLIC_AUTH_API_URL must point to the configured Replit production server.'
             exit 1
           fi
          echo 'Firebase public configuration variables are present.'

      - name: Export Expo web build
        run: pnpm --filter @workspace/private-world run web:build

      - name: Add GitHub Pages SPA fallback
        run: cp artifacts/private-world/dist/index.html artifacts/private-world/dist/404.html

      - name: Verify web artifact safety
        shell: bash
        run: |
          test -f artifacts/private-world/dist/index.html
          test -f artifacts/private-world/dist/404.html
          test -n "$(find artifacts/private-world/dist -type f -name '*.js' -print -quit)"
          if grep -R -l -E 'firebase-admin|FIREBASE_SERVICE_ACCOUNT_KEY|GOOGLE_APPLICATION_CREDENTIALS|private_key' artifacts/private-world/dist; then
            echo 'Server credential markers detected in the web artifact.'
            exit 1
          fi
          for public_value in 'crush-61d24' 'crush-61d24.firebaseapp.com' 'crush-61d24.firebasestorage.app' '499774288399' '1:499774288399:web:8783a68942b9129965297a' 'shared-chronicle--faizaniqubal206.replit.app'; do
            if ! grep -R -q -- "$public_value" artifacts/private-world/dist; then
              echo "Expected public configuration marker is missing from the web artifact."
              exit 1
            fi
          done
          echo 'Firebase public configuration is embedded in the web artifact.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/private-world/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
